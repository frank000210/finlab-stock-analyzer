<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="740" viewBox="0 0 1320 740">
  <title>別人怎麼走進你的網站？</title>
  <desc>訪客在瀏覽器輸入網址（像招牌），網址對應到主機的 IP 位址（像門牌），來到你的主機。主機裡依序是防火牆、Caddy 加密、網站程式、資料庫。訪客走 80、443 號門；管理者用金鑰走 22 號門。</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#d97706"/>
    </marker>
    <marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif; fill: #1f2937; }
      .title { font-size: 44px; font-weight: 700; text-anchor: middle; }
      .card { fill: #fff; stroke: #cbd5e1; stroke-width: 2.2; }
      .cardBlue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.2; }
      .cardTitle { font-size: 22px; font-weight: 700; text-anchor: middle; }
      .cardNote { font-size: 17px; text-anchor: middle; fill: #475569; }
      .panel { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2.5; }
      .head { font-size: 26px; font-weight: 700; text-anchor: middle; fill: #334155; }
      .sub { font-size: 18px; text-anchor: middle; fill: #475569; }
      .door { fill: #fff; stroke-width: 2.2; }
      .doorText { font-size: 17px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .label { font-size: 20px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="1320" height="740" fill="#fff"/>
  <text x="660" y="76" class="title">別人怎麼走進你的網站？</text>

  <!-- 你的主機 -->
  <rect x="820" y="110" width="460" height="580" rx="26" class="panel"/>
  <text x="1050" y="156" class="head">你的主機</text>
  <text x="1050" y="184" class="sub">一台 24 小時開機的電腦</text>

  <rect x="860" y="205" width="380" height="80" rx="14" class="card" style="stroke:#475569;stroke-width:3;fill:#fff"/>
  <text x="1050" y="240" class="cardTitle">防火牆：大樓門禁</text>
  <text x="1050" y="268" class="cardNote">只開 80、443 兩道門給訪客</text>

  <rect x="860" y="323" width="380" height="80" rx="14" class="card"/>
  <text x="1050" y="358" class="cardTitle">Caddy：加密</text>
  <text x="1050" y="386" class="cardNote">網址前出現小鎖頭</text>

  <rect x="860" y="441" width="380" height="80" rx="14" class="card"/>
  <text x="1050" y="476" class="cardTitle">網站程式</text>
  <text x="1050" y="504" class="cardNote">裝在 Docker 貨櫃裡</text>

  <rect x="860" y="559" width="380" height="80" rx="14" class="card"/>
  <text x="1050" y="594" class="cardTitle">資料庫</text>
  <text x="1050" y="622" class="cardNote">每天自動備份</text>

  <path d="M 1050 289 V 319" style="stroke:#475569;stroke-width:4;fill:none;marker-end:url(#a-slate);stroke-linecap:round"/>
  <path d="M 1050 407 V 437" style="stroke:#475569;stroke-width:4;fill:none;marker-end:url(#a-slate);stroke-linecap:round"/>
  <path d="M 1050 525 V 555" style="stroke:#475569;stroke-width:4;fill:none;marker-end:url(#a-slate);stroke-linecap:round"/>

  <!-- 訪客路徑 -->
  <rect x="40" y="190" width="180" height="110" rx="18" class="cardBlue"/>
  <text x="130" y="236" class="cardTitle">訪客</text>
  <text x="130" y="268" class="cardNote">在瀏覽器輸入網址</text>

  <rect x="290" y="190" width="180" height="110" rx="18" class="cardBlue"/>
  <text x="380" y="236" class="cardTitle">網址 ＝ 招牌</text>
  <text x="380" y="268" class="cardNote" style="font-size:15px">例：1-2-3-4.sslip.io</text>

  <rect x="540" y="190" width="180" height="110" rx="18" class="cardBlue"/>
  <text x="630" y="236" class="cardTitle" style="font-size:20px">IP 位址 ＝ 門牌</text>
  <text x="630" y="268" class="cardNote">例：1.2.3.4</text>

  <path d="M 224 245 H 286" style="stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#a-blue);stroke-linecap:round"/>
  <path d="M 474 245 H 536" style="stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#a-blue);stroke-linecap:round"/>
  <text x="505" y="226" class="label" style="fill:#1d4ed8;font-size:17px">對應到</text>
  <path d="M 724 245 H 856" style="stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#a-blue);stroke-linecap:round"/>
  <rect x="731" y="190" width="118" height="28" rx="14" class="door" style="stroke:#2563eb"/>
  <text x="790" y="204" class="doorText" style="fill:#1d4ed8">80、443 號門</text>

  <!-- 管理者支線 -->
  <rect x="40" y="470" width="240" height="90" rx="18" style="fill:#fffbeb;stroke:#d97706;stroke-width:2.2"/>
  <text x="160" y="508" class="cardTitle" style="fill:#b45309">你（管理者）</text>
  <text x="160" y="536" class="cardNote">用金鑰登入主機做管理</text>
  <path d="M 284 515 H 760 V 270 H 856" style="stroke:#d97706;stroke-width:4;fill:none;marker-end:url(#a-amber);stroke-linecap:round;stroke-linejoin:round"/>
  <text x="527" y="498" class="label" style="fill:#b45309">只收金鑰</text>
  <rect x="712" y="372" width="96" height="28" rx="14" class="door" style="stroke:#d97706"/>
  <text x="760" y="386" class="doorText" style="fill:#b45309">22 號門</text>
</svg>
