name: Deploy to Zeabur (legacy, disabled)

# 2026-10 起正式站已搬離 Zeabur（Zeabur 2026-12-31 停運），部署改用
# deploy/scripts/ship.sh 到自架主機。這裡改成只能手動觸發，避免 push master
# 時對已停用的 Zeabur 專案自動部署；確認不再需要後可整個刪除。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Zeabur
        run: npx zeabur deploy --project-id 6a3f6ff522d1fdaf7eb04d04 --service-id 6a3f700322d1fdaf7eb04d06 -i=false
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
