    --good:#7DC79B; --good-soft:#1C3327;
    --neutral-tag:#A7B0B8; --neutral-soft:#242B30;

  --bg:#121815; --surface:#1A211D; --surface-2:#212923;
  --ink:#E7EDE9; --ink-muted:#97A69D; --ink-faint:#6C7A72;

*{box-sizing:border-box;}
html,body{background:var(--bg);color:var(--ink);}
body{
  font-family: -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
  line-height:1.55;
  max-width:920px;
  margin:0 auto;
  padding:32px 20px 96px;
}
.serif{ font-family: ui-serif, Georgia, "Iowan Old Style", "Noto Serif TC", "PingFang TC", serif; }
.mono{ font-family: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, monospace; font-variant-numeric: tabular-nums; }

header.top{
  position:sticky; top:0; z-index:10;
  background:var(--bg);
  padding:20px 0 16px;
  border-bottom:1px solid var(--line);
  margin-bottom:28px;
}
h1{
  font-size:1.7rem; margin:0 0 4px; text-wrap:balance;
  letter-spacing:-0.01em;
}
.subtitle{ color:var(--ink-muted); font-size:0.92rem; margin:0 0 16px; }

.stats{
  display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;
}
.stat{
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:8px 14px; display:flex; flex-direction:column; gap:2px; min-width:88px;
}
.stat b{ font-size:1.15rem; }
.stat span{ font-size:0.72rem; color:var(--ink-muted); text-transform:uppercase; letter-spacing:0.04em; }

.search-row{ display:flex; gap:8px; align-items:center; }
#search{
  flex:1; font-size:0.95rem; padding:10px 14px; border-radius:10px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font-family:inherit;
}
#search:focus{ outline:2px solid var(--accent); outline-offset:1px; }
#count{ font-size:0.8rem; color:var(--ink-muted); white-space:nowrap; }

.legend{ display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; font-size:0.76rem; color:var(--ink-muted); }
.legend .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:middle; }

main{ display:flex; flex-direction:column; gap:18px; }

.series{
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:18px 20px; box-shadow:var(--shadow);
}
.series.hidden{ display:none; }
.series-head{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:6px;}
.series-head-left{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.date{ font-size:0.8rem; color:var(--accent-ink); background:var(--accent-soft); padding:2px 9px; border-radius:999px; font-weight:600; }
.range{ font-size:0.78rem; color:var(--ink-faint); }
.inprogress{ font-size:0.75rem; color:var(--warn); background:var(--warn-soft); padding:2px 9px; border-radius:999px; font-weight:600; }
h2{ font-size:1.12rem; margin:2px 0 8px; text-wrap:balance; }
.summary{ font-size:0.88rem; color:var(--ink-muted); margin:0 0 12px; max-width:70ch; }

ul.items{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1px; }
li.item{
  display:grid; grid-template-columns: 20px 52px 1fr; gap:10px; align-items:start;
  padding:7px 6px; border-radius:6px;
}
li.item:hover{ background:var(--surface-2); }
li.item.hidden{ display:none; }
.stripe{ width:6px; height:6px; border-radius:50%; margin-top:7px; justify-self:center; }
.stripe.critical{ background:var(--critical); }
.stripe.warn{ background:var(--warn); }
.stripe.good{ background:var(--good); }
.stripe.neutral{ background:var(--neutral-tag); }
.code{ font-size:0.78rem; color:var(--ink-faint); padding-top:1px; }
.text{ font-size:0.89rem; }
.text mark{ background:var(--accent-soft); color:var(--accent-ink); border-radius:3px; padding:0 2px; }

footer{ margin-top:36px; font-size:0.78rem; color:var(--ink-faint); text-align:center; }

@media (max-width: 560px){
  li.item{ grid-template-columns: 16px 44px 1fr; }
  .stats{ gap:6px; }
  .stat{ min-width:76px; padding:6px 10px; }
}
</style>

 items:[
  {code:'ZZ1', tag:'warn', text:'JournalView 新增 Jesse Livermore 加碼偵測器。對已平倉的賠損單（R<0）追蹤：若同標的在 14 天內再次進場，計為「加碼事件」；顯示加碼率（事件數/賠損後機會數），> 30% 顯示警告。Livermore 的最大教訓：在虧損後加碼是毀滅性的，偵測此行為讓使用者看清自己是否在做「攤平」。'},
  {code:'ZZ2', tag:'good', text:'JournalView 新增 Nassim Taleb 波動率政策績效表。按停損距離%分為緊(<2%)、中(2-4%)、寬(>4%)三個政策層，顯示各層的筆數與平均R。Taleb：不同波動率政策下系統的績效分布，才能知道你的策略在哪種市場環境最有優勢，應動態調整部位大小而非固定規則。'},
  {code:'ZZ3', tag:'good', text:'DecisionView 新增 William Eckhardt 損益平衡安全邊際卡。計算實際勝率 vs 損平所需勝率（avgLoss/(avgWin+avgLoss)），以及實際R:R vs 損平所需R:R（(1-W)/W）；兩個邊際均正才代表系統有真正的數學優勢。Eckhardt：用單一指標（勝率或R:R）判斷系統好壞是不夠的，必須雙維度同時為正。'},
  {code:'ZZ4', tag:'good', text:'JournalView 新增 Stan Druckenmiller 高信念倉位驗證卡。按張數中位數分大倉/小倉兩組，比較兩組平均R；大倉均值 > 小倉均值 = 信念有回報，否則顯示警告。Druckenmiller 的精髓：確信時重壓，不確信時輕倉；若大倉績效更差，代表你加倉的判斷是情緒性的，不是基於信念的。'},
  {code:'ZZ5', tag:'good', text:'JournalView 新增 Larry Williams 持倉甜蜜區分析。按出場日-入場日分為≤1天/2-5天/6-14天/≥15天四桶，顯示各桶筆數與平均R及視覺長條圖。Williams：每個策略都有最佳持倉時長，太早出或持太久都是傷害；透過甜蜜區量化，讓使用者知道自己的系統最適合多長持倉週期。'},
  {code:'ZZ6', tag:'good', text:'JournalView 新增 Peter Lynch 個股淨P&L排名卡。按 symbol 彙整累積淨R，顯示前三名最佳/最差標的；需 ≥ 2 個不同標的。Lynch：Know what you own；識別哪些股票持續貢獻正值、哪些拖累績效，是分配研究時間和選股精力的依據，避免在爛股上反覆止損。'},
  {code:'ZZ7', tag:'good', text:'RiskMonitorView 新增 Ed Seykota 標籤×月份 R 熱圖。以 tag 為行、月份為列，顯示各格的平均R；熱色分三級（正/微正/負）。Seykota：讓系統告訴你何時何類交易最有優勢；跨標籤×時間的二維熱圖能揭示季節性偏差，讓使用者在弱勢格子縮規模或停手。'},
  {code:'ZZ8', tag:'warn', text:'RiskMonitorView 新增 Richard Dennis 前瞻連虧情境壓力測試。計算平均張數，模擬 3/5/10 連敗的總損失張數，同時顯示歷史最長連虧紀錄。Dennis：海龜必須在心理上提前接受任何可能的連虧期；若你不能接受 10 連虧的數字，現在的倉位就太大了。'},
  {code:'ZZ9', tag:'good', text:'DecisionView 新增 Mark Minervini 進場品質分層分析。按停損距離%分為緊縮<2%/適中2-4%/寬鬆>4%三層，顯示各層筆數、勝率、平均R。Minervini 的 SEPA 理論：緊縮停損設定才能在失敗時損失最小，同時找到高勝率進場點；量化各停損層績效，讓使用者知道是否應更嚴格執行進場紀律。'},
  {code:'ZZ10', tag:'good', text:'RiskMonitorView 新增 Jack Schwager 綜合巫師評分卡。五維度加權：SQN(30分)、權益曲線R²(20分)、獲利因子RF(20分)、離群貢獻(15分)、近月勝率(15分)，滿分100分，需 ≥ 20 筆。Schwager 訪問了最偉大的交易員後發現：沒有單一關鍵，而是多個維度同時表現優秀；綜合評分讓系統品質一目了然，也能追蹤各維度的弱項。'},
 ]
},
{date:'2026-08-16 17:00', range:'YY1–YY10', title:'自主循環優化：投資界標竿心法驅動的系統品質與紀律度量（Van Tharp／Paul Tudor Jones／Ed Seykota／Tom Basso／Michael Covel／Bruce Kovner／Mark Douglas）',
 desc:'第十一輪自主優化：聚焦系統品質量化（SQN）、催化劑選擇性、季節性勝率、倉位紀律、離群贏單、停損一致性、R:R達成、期望值演化、權益曲線平滑度、以及例行儀式合規率。YY1-YY5 擴充 JournalView；YY6 YY7 YY10 在 DecisionView；YY8 YY9 在 RiskMonitorView。10/10 Playwright e2e 測試通過。',
 items:[
  {code:'YY1', tag:'good', text:'JournalView 新增 Van Tharp SQN 系統品質分數卡。SQN = mean(R)/std(R)×√min(N,100)，需 ≥ 20 筆才計算；≥3 優秀、≥2 良好、≥1 普通、<1 差。比勝率或 PF 更完整地評估系統邊際優勢，是評估是否值得交易的核心指標。'},
  {code:'YY2', tag:'good', text:'JournalView 新增 Paul Tudor Jones 催化劑績效分層表。按 catalyst 欄位分組，顯示各類型的筆數、勝率、均值R、獲利因子；需 ≥ 2 個催化劑類別且各 ≥ 2 筆。識別哪種進場理由最強，只做最強的設定類型是選擇性的核心。'},
  {code:'YY3', tag:'good', text:'JournalView 新增 Ed Seykota 月份勝率模式 12 柱長條圖。按出場月份（1-12月）分組，顯示各月份歷史勝率；綠色 ≥ 60%、黃色 40-60%、紅色 < 40%。季節性感知讓使用者在弱勢月份主動降頻或縮部位規模。'},
  {code:'YY4', tag:'warn', text:'JournalView 新增 Tom Basso 倉位大小績效相關卡。按中位數張數分為大小兩組，比較兩組勝率；若大單勝率 < 小單勝率 - 5% 顯示情緒化警告。系統化者的倉位大小不應影響勝率，差距代表大倉心理壓力干擾執行。'},
  {code:'YY5', tag:'good', text:'JournalView 新增 Seykota/Covel 離群贏單貢獻度卡。前 10% 大贏佔總正R比重；> 40% = 健康右尾（讓贏家奔跑），同時顯示「移除離群後」的系統R，讓使用者感知系統對極端右尾的依賴程度。'},
  {code:'YY6', tag:'good', text:'DecisionView 新增 Tom Basso 停損距離一致性（CV）卡。CV = std(停損距離%) / mean(停損距離%)；< 30% 判定為「系統化」，否則顯示「⚠ 不一致」。停損設定不一致代表進場前沒有標準化的風控流程，紀律性低。'},
  {code:'YY7', tag:'good', text:'DecisionView 新增 Van Tharp 計畫 R:R 達成率分布圖。按 actualR/plannedRR 分成 5 個桶（<25%、25-50%、50-75%、75-100%、>100%），視覺化執行落差的分布；追蹤計畫執行落差才能找到改善點，是優化出場紀律的量化基礎。'},
  {code:'YY8', tag:'good', text:'RiskMonitorView 新增 Bruce Kovner 期望值三階段分析。將已平倉交易按時間三等分（早期/中期/近期），比較各階段平均R；近期均值 > 早期均值代表「持續改善」。追蹤系統是否在學習進化，是自我評估的最誠實指標。'},
  {code:'YY9', tag:'good', text:'RiskMonitorView 新增 Ed Seykota 權益曲線平滑度 R² 分析。對累積R序列做線性迴歸，R² = 1 - ssRes/ssTot；≥ 0.9 平滑、≥ 0.7 中等、< 0.7 不穩定。好系統的equity curve接近直線向上，R²衡量此特性而不被單一大虧或大贏干擾。'},
  {code:'YY10', tag:'good', text:'DecisionView 新增 Mark Douglas 開盤前清單合規率卡。掃描最近 30 天 localStorage（finlab_pretrade_chk_YYYY-MM-DD）的完成天數，同時顯示近7天完成率；一致的例行程序是穩定心態的基礎，合規率 < 50% 代表儀式感不足，紀律來自習慣。'},
 ]
},
{date:'2026-08-16 09:00', range:'XX1–XX10', title:'自主循環優化：投資界標竿心法驅動的交易診斷深化（Ed Thorp／Nick Radge／Darvas／Dalio／Covel／CTA PF／Richard Dennis／Martin Schwartz／George Soros／William O\'Neil）',
 desc:'第十輪自主優化：聚焦數學最優化、動態停手機制、分散紀律、以及交易評分系統化。XX1-XX2 XX5-XX6 XX8-XX10 擴充 JournalView 分析模組；XX3 XX4 在 DecisionView 建立開倉監控機制；XX7 在 RiskMonitorView 加入回撤週期追蹤器。',
 items:[
  {code:'XX1', tag:'good', text:'JournalView 新增 Kelly Fraction 倉位建議卡（Ed Thorp: 數學上最優的賭注比例）。顯示 Full Kelly 和 ¼-Kelly 兩個關鍵值。實戰建議使用 ¼-Kelly 作為單筆風險上限，超過 Full Kelly 在數學上保證長期虧損；以勝率和平均賠比即時計算，隨交易日誌更新。'},
  {code:'XX2', tag:'good', text:'JournalView 新增權益曲線動能信號（Nick Radge: 交易自己的權益曲線）。計算最近10筆累計R的移動平均線；當前累積R低於SMA顯示「⚠ PAUSE」警告，代表系統正在走冷；高於SMA顯示「✓ TRADE」，代表系統處於正向均值回歸狀態。'},
  {code:'XX3', tag:'warn', text:'DecisionView 新增開倉逾期警示儀表板（Nicholas Darvas: 箱型理論的時間紀律）。對每筆開倉顯示已持天數 vs 平均贏單持倉天數；超過平均顯示「注意」，超過2倍平均顯示「⚠ 嚴重逾期」。持倉超過贏單均值時間代表市場未如預期，應重新評估是否繼續持有。'},
  {code:'XX4', tag:'warn', text:'DecisionView 新增開倉標籤集中度監控（Ray Dalio: 真正的分散需要不相關資產）。按 tag 欄位分組所有開倉張數，任一標籤超過 50% 時顯示「⚠ 集中警示」；用比例長條圖視覺化各標籤佔比，讓使用者即時識別假分散風險。'},
  {code:'XX5', tag:'good', text:'JournalView 新增 R 四分位分布分析卡（Michael Covel: 趨勢跟蹤者靠右尾肥賺錢）。顯示全部已平倉交易的 P25/P50/P75 R 值；P75 < 1.5R 觸發警告，代表利潤右尾偏薄，可能提早出場或沒讓贏家充分奔跑，是趨勢跟隨系統的致命弱點。'},
  {code:'XX6', tag:'good', text:'JournalView 新增月獲利因子趨勢 sparkline（CTA 行業標準）。月獲利因子 PF = 月正R總和 / 月負R總和絕對值；sparkline 顯示近6個月趨勢，PF < 1 代表負期望值月份。相比月報酬總量，PF 更純粹地衡量系統質量，不被部位大小影響。'},
  {code:'XX7', tag:'good', text:'RiskMonitorView 新增回撤週期追蹤器（Richard Dennis/Turtle: 系統強健的指標是能快速恢復）。識別權益曲線的每段回撤週期，記錄深度（R）和恢復所需筆數；顯示前5大歷史回撤及平均恢復筆數。恢復筆數 > 10 為系統韌性不足的警告訊號。'},
  {code:'XX8', tag:'warn', text:'JournalView 新增停損觸發恢復成本分析表（Martin Schwartz: 輸家不知道輸一筆要贏幾筆才能回來）。對每筆開倉計算：若觸及停損（-1R×張數），需要幾筆均值贏單才能回本；超過3筆為高恢復成本警告，讓使用者在進場前意識到這筆交易失敗的真實代價。'},
  {code:'XX9', tag:'good', text:'JournalView 新增當前連勝/連敗機率分析（George Soros: 隨機性中的極端是正常的）。使用二項分佈估算當前連線長度的統計出現機率；機率 < 10% 定義為「罕見」——罕見連勝警示不要過度自信加碼，罕見連敗區別隨機壞運與系統失效，幫助使用者做出更理性的下一步判斷。'},
  {code:'XX10', tag:'good', text:'JournalView 新增交易評分分布統計（William O\'Neil/IBD: 只做 A 級設定）。依四條件對每筆已平倉交易評級：A=達目標且R≥均值贏單（完美執行）、B=符合其中一條件（部分執行）、C=正報酬但均未達成（運氣成分高）、D=虧損（執行失誤或設定不符系統）。'},
 ]
},
{date:'2026-08-12 09:00', range:'WW1–WW10', title:'自主循環優化：投資界標竿心法驅動的交易品質深化（Livermore／Druckenmiller／Tom Basso／Larry Williams／PTJ／Mark Douglas／Minervini／機構週月節奏）',
 desc:'第九輪自主優化：聚焦交易行為品質與系統一致性。WW1-WW5 WW7 WW8 擴充 JournalView 分析模組；WW6 WW10 在 DecisionView 建立每日開盤儀式；WW9 在 RiskMonitorView 加入機構月 P&L 剖面。',
 items:[
  {code:'WW1', tag:'good', text:'JournalView 新增贏/輸單平均持倉天數分析（Livermore: 知道你的時間框架）。輸單持倉比贏單更久 = 凹單傾向，系統性地害怕認賠。贏單應讓利潤奔跑，輸單應截虧快出，此指標量化是否符合這一原則。'},
  {code:'WW2', tag:'good', text:'JournalView 新增滾動10筆勝率趨勢 sparkline（Druckenmiller: 系統轉好/轉壞要早發現）。滑動窗口勝率下滑代表系統走冷，應縮減新部位或暫停；上升代表系統回暖，可適度加大標準部位。'},
  {code:'WW3', tag:'warn', text:'JournalView 新增張數一致性 CV 統計卡（Tom Basso: 系統化不只是進場訊號，連部位大小也要一致）。CV（標準差/平均）> 20% 顯示警告；感情用事地在「感覺好」時放大、「感覺差」時縮小，是系統化最大殺手。'},
  {code:'WW4', tag:'warn', text:'JournalView 新增近零報酬交易滲漏統計（Larry Williams: 小贏和小輸都是資本浪費）。|R| < 0.3 的交易消耗手續費、滑價與注意力卻無績效貢獻；> 20% 代表入場標準過鬆，應提高最低進場條件。'},
  {code:'WW5', tag:'good', text:'JournalView 新增 R/天資本效率統計卡（Druckenmiller: 同樣獲利，佔用資金越少天越有效率）。Total R ÷ 跨度日曆天數，衡量策略翻倉速度，讓使用者評估是否在非最優時機長期持有閒置倉位。'},
  {code:'WW6', tag:'good', text:'DecisionView 新增開盤前五項確認清單（Mark Douglas: 儀式感創造紀律）。五題涵蓋大盤方向確認、停損設定、訊號是否出現、剩餘虧損額度、符合系統規則。每日以日期 key 自動重置，防止帶著昨日偏見操作今天。'},
  {code:'WW7', tag:'good', text:'JournalView 新增近8週週績效表（機構標準: 週為最小績效評估單位）。顯示每週筆數、週 R、累計 R，幫助使用者識別季節性弱週與系統轉折時間點，採機構評核節奏定期回顧。'},
  {code:'WW8', tag:'good', text:'JournalView 新增目標達成率＋平均獲利捕捉率分析塊（PTJ: 只做你知道會成功的交易，事後驗證預測力）。達標率衡量設定目標的準確性；捕捉率 < 70% 代表習慣提早出場，複查是否存在過早鎖利的習慣。'},
  {code:'WW9', tag:'good', text:'RiskMonitorView 新增月報酬統計（機構月 P&L 剖面）。顯示月報酬中位數（比平均更穩健，不被異常月拉偏）、月報酬標準差（系統穩定性）、正報酬月比率（≥ 60% = 穩定，< 40% = 警告），讓使用者以機構視角審視系統的月度一致性。'},
  {code:'WW10', tag:'warn', text:'DecisionView 新增今日最大虧損限制追蹤器（Minervini: 日內硬停板，觸及即停止交易）。從當日出場交易即時計算今日已實現 R，超過使用者設定上限時顯示紅色警告「已觸日內停板」，防止連續虧損後報復性加倉。'},
 ]
},
{date:'2026-08-04 01:00', range:'VV1–VV10', title:'自主循環優化：投資界標竿心法驅動的交易分析深化（Mark Douglas／CTA Recovery Factor／O\'Neil CAN SLIM／Van Tharp／Taleb／Templeton／PTJ）',
 summary:'以七位投資/交易大師心法為主軸，盤點 10 項可落地的交易系統深化項目，3 輪自我審查後實作。橫跨 JournalView、MonteCarloView、RiskSizingView、RiskMonitorView 四個前端元件，共新增 429 行。Journal 新增當前連勝/連敗條數（VV1）、Recovery Factor（VV2）、催化劑/進場理由分析表（VV3）、交易頻率警告（VV4）、標的集中度橫條圖（VV7）、開倉總熱度%（VV8）、異常大贏依賴度（VV10）；MC 新增最少連虧至破產筆數（VV5）；RiskSizing 新增此勝率下最低需要 R:R 檢查（VV6）；RiskMonitor 新增距權益高水位回撤（VV9）。全部瀏覽器驗證通過，10 個新 E2E 測試一起上版。',
 items:[
  {code:'VV1', tag:'good', text:'JournalView 新增當前連勝/連敗條數統計卡（Mark Douglas: 交易狀態覺察）。連敗 ≥ 3 筆時顯示橘色警告「避免復仇交易」，提醒使用者每次結果都是獨立機率事件，連敗不代表系統壞掉。'},
  {code:'VV2', tag:'good', text:'JournalView 新增 Recovery Factor 統計卡（CTA 業界標準）。累計 R ÷ R 曲線最大回撤：> 3 優秀（系統能快速從連虧中回復），1-3 尚可，< 1 代表至今尚未從最大回撤中回到高點，需要改善。'},
  {code:'VV3', tag:'good', text:'JournalView 新增依催化劑/進場理由分組統計表（O\'Neil CAN SLIM：知道「為什麼」進場，勝率才能穩定）。按 catalyst 欄位分組，取前 5 高期望值的進場理由，協助使用者識別哪種進場邏輯最具優勢。'},

{date:'2026-08-02 22:00', range:'RR1–RR10', title:'自主循環優化：API 鑑權補齊、計時安全比較、原子操作、async 阻塞修復、Symbol 正規化、棄用 API 更新',
 summary:'盤點 10 項可驗證的真實缺陷，3 輪自我審查後實作。橫跨 6 個後端 API 模組與 3 個前端 Vue 元件：補齊 trade/risk/alerts/sync-watchlist 端點的 admin 驗證並補上前端 authHeaders（RR1–RR3）；kb-web 的同步 PyMongo 呼叫移至執行緒池（RR4）；timing oracle 防護改用 hmac.compare_digest（RR5）；allowed_admin_emails 改用 MongoDB 原子 $addToSet/$pull（RR6）；Google OAuth verify 端點補上 IP 節流（RR7）；kb-web 對話歷史列表加 Pydantic max_length=20 上限（RR8）；social_buzz 快取鍵改用 normalize_symbol 避免 .TW/.TWO 重複快取（RR9）；asyncio.get_event_loop() 換為 Python 3.10+ 標準的 get_running_loop()（RR10）。',
 items:[
  {code:'RR1', tag:'critical', text:'trade.py 的 GET /pending 與 POST /approve 端點完全缺少 admin 驗證——任意訪客可查看全部待審交易並核准/駁回。加上 Depends(require_admin) gate；TradeApprovalView.vue 補上 useAuthStore + authHeaders() 並加入非 admin 狀態的登入提示 UI。'},
  {code:'RR2', tag:'critical', text:'risk.py 的 GET /alerts、POST /alerts、GET /alerts/history、DELETE /alerts/{id} 四個端點無需驗證，任何人可查看、新增、刪除全站價格警報。加上 Depends(require_admin)；PriceAlertView.vue 5 個 fetch 呼叫全補 authHeaders()。'},
  {code:'RR3', tag:'warn', text:'risk.py 的 POST /sync-watchlist（觸發外部 API 批量爬蟲）無驗證可被匿名觸發；CommandView.vue 在送出同步請求時也沒帶 admin token。兩端同步補上驗證。'},
  {code:'RR4', tag:'warn', text:'kb-web ask.py 的 _bump_daily_quota() 與 _store_qa() 是同步 PyMongo 函式，在 async handler 內直接呼叫——阻塞 event loop，高並發下影響整個 kb-web 服務。改以 asyncio.to_thread() 移入執行緒池執行。'},
  {code:'RR5', tag:'warn', text:'analytics.py 的 _require_admin_token 使用 == 比較 token 字串，存在計時旁道攻擊（timing oracle）。改用 hmac.compare_digest() 進行時間恆定比較。'},

  {code:'RR7', tag:'warn', text:'auth.py 的 POST /google/verify 端點無 IP 節流——攻擊者可批次測試 Google token 是否屬於本站 admin。仿 _check_signal_rules_rate_limit 模式補上 IP 節流（10 分鐘內 20 次上限）。'},
  {code:'RR8', tag:'neutral', text:'kb-web AskPayload.history 列表無長度上限，惡意用戶可送入超大歷史列表撐大 LLM prompt、增加 token 消耗。加上 Pydantic Field(max_length=20) 硬性上限。'},
  {code:'RR9', tag:'neutral', text:'social_buzz.py 的快取鍵使用原始 symbol 字串——「2330」與「2330.TW」得到兩份快取，繞過 30 分鐘 TTL、重複觸發外部爬蟲，有 IP 被封鎖的風險。改用 normalize_symbol() 正規化後作為 cache key。'},
  {code:'RR10', tag:'neutral', text:'signal_rules.py 使用 asyncio.get_event_loop()，在 Python 3.10+ 已棄用、3.12+ 在部分情境下拋 RuntimeError。改為 asyncio.get_running_loop()，語意更精確（只在已有事件迴圈時有效）。'},
 ]},

{date:'2026-08-02 20:00', range:'QQ1–QQ10', title:'自主循環優化：async 阻塞修復、datetime 時區補正、UI 穩健性、kb-web 引用精確化與安全強化',
 summary:'盤點 10 項可驗證的真實缺陷，3 輪自我審查後實作。橫跨主站後端（AA1 async/AA2 datetime/AA9 email 驗證/AA10 admin gate）、前端日誌（AA3 null guard/AA4 debounce 合併/AA5 Infinity sentinel/AA6 entry=stop guard）、kb-web ask（AA7 移除假引用 fallback/AA8 啟動安全警告）。全部 234 Playwright e2e tests + 13 kb-web unit tests 通過。另附版本資訊 footer，首頁下方顯示 commit hash、API 端點數量及環境指示燈。',
 items:[
  {code:'QQ1', tag:'warn', text:'backend/main.py 的 _git_commit_hash() 與 JSON 讀檔在 async handler 內同步呼叫——每次健康檢查都凍結 event loop。改為模組頂層一次讀取並快取，async handler 只讀全域變數。'},
  {code:'QQ2', tag:'warn', text:'analytics.py 與 admin.py 大量使用已棄用的 datetime.utcnow()，在 Python 3.12+ 產生 DeprecationWarning 且回傳 naive datetime，與 MongoDB 的 timezone-aware 比較時行為未定義。全面換為 datetime.now(timezone.utc)。'},
  {code:'QQ3', tag:'neutral', text:'JournalView 的 holdDays() 對 openDate/exitDate 為 null/undefined 時直接運算，回傳 NaN 顯示在 UI。補上 null guard，null 時回傳 null 再轉為「—」。'},
  {code:'QQ4', tag:'neutral', text:'JournalView 三個 watch(openSymbols) 各自獨立 trigger，一次 symbol 切換會同時發出三批 API 請求。改為共用一個 clearTimeout/setTimeout 300ms debounce，三個 watcher 共用同一個 timer，只執行最後一次。'},
  {code:'QQ5', tag:'neutral', text:'JournalView 的 profitFactor 在 grossLoss=0 時為 Infinity，.toFixed(2) 回傳字串 "Infinity"，coachInsights 文字也直接插入。新增 fmt() helper 將 Infinity 渲染為 ∞，同步修正 coachInsights 文字。'},
  {code:'QQ6', tag:'warn', text:'importOpenPositions 若 entry === stop（R 分母為 0），下游 R-multiple 計算全部崩潰。補上 entryN === stopN 守衛，跳過無效部位並記錄警告。'},
  {code:'QQ7', tag:'warn', text:'kb-web _parse_citations() 在 LLM 答案無任何 [N] 標記時，把所有段落都塞進 citations（fallback-all），造成 UI 顯示假引用、誤導使用者。改為回傳空列表，UI 誠實顯示「無引用來源」。'},
  {code:'QQ8', tag:'neutral', text:'kb-web config.py 啟動時若 JWT_SECRET 仍是預設值或 OPENCODE_API_KEY 未設定，完全無提示——部署到正式環境前的安全問題不可見。補上 logger.warning()，讓部署前的配置問題可見於 stdout。'},
  {code:'QQ9', tag:'warn', text:'analytics.py 的 UserIdentifyPayload.email 欄位無格式驗證，任意字串可寫入 MongoDB。加上 Pydantic field_validator：regex 格式驗證 + 254 字元上限 + strip/lowercase 正規化。'},
  {code:'QQ10', tag:'warn', text:'analytics.py 的 GET /pageviews 與 /pageviews/{page} 端點缺少 admin token 驗證，任何人可查詢所有頁面瀏覽統計。加上 Depends(_require_admin_token) gate（X-Admin-Token header 比對 settings.admin_secret）；AdminView.vue 原已帶入 token，無需前端改動。'},
 ]},

{date:'2026-08-02 14:00', range:'PP1–PP7', title:'kb-web 問答品質優化：多查詢 RRF 融合、Agentic 迴圈、上網搜尋、精確引用、對話歷史',
 summary:'從使用者視角盤點問答功能的核心痛點，7 項優化分成「找得更準」（PP1 查詢改寫＋PP2 RRF 融合）、「想得更深」（PP3 多輪 Agentic 迴圈＋PP4 網路搜尋）、「引用更準確」（PP5 編號引用）、「問得更連貫」（PP6 對話歷史）、「過程更透明」（PP7 搜尋步驟展示＋回饋）。全部 7 項均有對應的自動化測試（28 tests 全過），Ask.vue 前端同步更新。',
 items:[
  {code:'PP1', tag:'good', text:'問句改寫——問答前先讓 LLM 把問題展開成 2-3 組不同角度的搜尋詞（同義詞、中英術語、上位概念），提升知識庫召回率；改寫失敗時靜默回退原問題，不影響既有行為。'},
  {code:'PP2', tag:'good', text:'多查詢 RRF 融合——為每組改寫後的查詢各跑一次 search_knowledge，用標準 Reciprocal Rank Fusion（score = Σ 1/(k+rank)）合併排名，候選擴大到 20 筆再取前 8，不依賴單一查詢的詞彙偶然性。'},
  {code:'PP3', tag:'good', text:'Agentic 迴圈——模型可在答案中輸出 TOOL_CALL JSON 指令再次查知識庫，後端解析執行、把結果塞回 messages 繼續對話；最多 N 輪（預設 3），防止無限迴圈；每輪獨立 bump 每日 quota 計數器。'},
  {code:'PP4', tag:'good', text:'上網搜尋工具——Agentic 迴圈內模型可呼叫 web_search（DuckDuckGo Instant Answers，免 API key）或 fetch_url（trafilatura 擷取正文）；fetch_url 套用跟 imports.py 相同的 SSRF 防護（ipaddress 模組驗 resolved IP）。'},
  {code:'PP5', tag:'good', text:'精確引用——段落以 [1][2]… 編號後傳給 LLM；答案裡出現的 [N] 以 regex 解析，只列出模型真正引用的段落；模型未引用任何編號時回退到全部段落（向下相容）。'},
  {code:'PP6', tag:'good', text:'對話歷史——前端帶入前 3 輪 Q&A 的 {role, content}；追問時模型能引用上輪的答案，前端加上「清除對話」按鈕，history 長度徽章顯示對話輪次。'},
  {code:'PP7', tag:'good', text:'搜尋透明度＋回饋——回應新增 steps（列出每步做了什麼：改寫/KB查詢/網路搜尋/網頁抓取）與 question_id；前端展示可摺疊的搜尋過程、👍/👎 按鈕向 /api/ask/feedback 送回饋（存入 qa_history.rating）。'},
 ]},

{date:'2026-08-02 12:00', range:'OO1–OO10', title:'主站自主循環優化：備援模型漏洞修復、節流補齊、競態消除、過期回應防護',
 summary:'這輪著重三類同款缺陷的系統性補齊：1) 兩個 AI 相關端點（/test、/alerts/check）遺漏跟全站一致的節流機制；2) 公開資訊頁的外部爬蟲快取鍵沒有格式驗證，可繞過快取無限觸發並行爬取；3) 四個搜尋輸入框在 debounce 期間切換股票時，過期回應仍會覆蓋新查詢結果。另外補上意見回饋功能（FB）與每次 git push 後自動整理 dev note 並匯入知識庫的 hook。',
 items:[
  {code:'OO1', tag:'warn', text:'llm/client.py 的 _post_once 只 catch HTTP 層例外決定要不要觸發備援模型，但 httpx 網路層例外（逾時、DNS 失敗）是 HTTPError 子類但先前不在 catch 範圍內，備援完全跳過——改把所有 httpx.HTTPError 包成 LLMUnavailable，讓外層 llm_complete 的備援邏輯覆蓋網路層失敗。'},
  {code:'OO2', tag:'warn', text:'signal_rules.py 的 /test 端點先前沒掛 _check_signal_rules_rate_limit 相依——同一個函式控制的 /evaluate 早就有節流，但「一次執行完整腳本」的 /test 反而沒有，補上。'},
  {code:'OO3', tag:'warn', text:'/alerts/check 對每個啟用中警報（上限 50）並行抓外部報價、可能觸發 Telegram——先前零節流，加上 IP 節流（10 分鐘 5 次，比 /notify 更嚴因為單次外部呼叫量更大）。'},
  {code:'OO4', tag:'warn', text:'_append_alert_history 是「讀整份 → Python 端 append/裁切 → 整份寫回」，跟 JJ4 修過的 price_alerts 同款競態——排程定時檢查跟手動「立即檢查」重疊時，兩次呼叫可能各自讀到同一份舊資料互相覆蓋。改用 Mongo 原子 $push + $each/$slice。'},
  {code:'OO5', tag:'neutral', text:'AnalysisView 的 loadAiSummary 失敗路徑先前沒有 requestToken 換股檢查——舊股票的請求若在使用者已換股後才失敗，會把新股票畫面蓋成「AI 摘要產生失敗」。補上跟成功路徑一致的換股檢查。'},
  {code:'OO6', tag:'neutral', text:'SocialBuzzView 同款，loadAiSummary 失敗路徑沒有 requestToken 換股檢查。'},
  {code:'OO7', tag:'neutral', text:'PriceAlertView 三個欄位都綁 @keyup.enter="addAlert"，函式本身沒擋在途請求——在任一欄按 Enter 後還沒收到回應就在另一欄按 Enter，會疊送第二次請求。補上 if (adding.value) return 防護。'},
  {code:'OO8', tag:'neutral', text:'WatchlistView / AppSidebar / StockCompareView / DecisionView 四個搜尋框的 debounce 只避免每次按鍵都發請求，不保證回應順序——debounce 等待期間換股後舊查詢仍可能蓋掉新結果。補上 requestToken 防護（跟 LL9/II8 同款）。'},
  {code:'OO9', tag:'warn', text:'public_data.py 的 /{symbol}/public-data 對每個請求分別扇出 4 個外部爬蟲（MOPS/TWSE/FinMind），快取鍵是原始代號字串無格式驗證——攻擊者可用不同無效代號繞過快取無限觸發。補上格式驗證 regex（同 JJ5 模式）與 IP 節流。'},
  {code:'OO10', tag:'neutral', text:'CommandView / RiskSizingView 的 localStorage.setItem 沒有包 try/catch——私密模式或 quota 滿時會直接丟出例外中斷操作。補上跟 tradeMath.js HH3 一致的例外防護。'},
 ]},

{date:'2026-08-02 02:23', range:'NN1–NN10', title:'kb-web 知識庫網頁：登入防暴力破解、SSRF 防護、LLM 備援機制修復',
 summary:'第一次對新建置的 kb-web（知識庫網頁）做自主循環優化，範圍跟先前 AA–MM 系列（主站 finlab-stock-analyzer）不同。盤點時先實際讀過現有程式碼驗證每一項（不是憑空列清單），初稿有一項（domain 欄位格式驗證）在自我審查時因影響力太低被換掉，改成後來發現的真安全問題（NN10 SSRF）。這次還撞上一次真實的維運事故：先前把 sentence-transformers（連帶 torch）加回 kb-web 的 Docker image 修語意搜尋時，在資源有限（US$20/月方案）的自架 K3s 伺服器上把整個叢集擠到離線，波及主站等所有服務——K3s 後來自行恢復，過程中沒有做任何破壞性操作（沒有點重啟/升級伺服器），先跟使用者確認再等待。',
 items:[
  {code:'NN1', tag:'critical', text:'/api/login 沒有失敗延遲/鎖定機制——規格書寫了要防暴力破解但從未真的實作，任何人可以無限次猜密碼。補上同一 IP 5 次失敗後鎖定 5 分鐘。'},
  {code:'NN10', tag:'critical', text:'/api/import/url 讓已登入者指定任意網址，由伺服器代為抓取，沒有擋內網/本機/雲端 metadata 位址——理論上可被用來探測同一台機器上跑的其他內部服務（SSRF）。解析主機名稱後用 ipaddress 檢查，擋掉 private/loopback/link-local/reserved/multicast。'},
  {code:'NN6', tag:'critical', text:'主模型/備援模型重試機制原本只 catch HTTPException，但 httpx 的網路層例外（逾時、DNS 失敗、連線被拒）不是 HTTPException，會直接變成未攔截的例外、跳過備援機制，使用者只看到不友善的 500。補上 httpx.RequestError 的攔截，正確觸發備援模型。'},
  {code:'NN2', tag:'warn', text:'/api/ask 沒有每日呼叫上限，而 kb-web 是跟主站共用同一把 OpenCode key——濫用或程式錯誤迴圈會把主站正式環境的 AI 額度一起燒光。用 Mongo 原子 $inc（同 LL2/主站既有手法）加上 kb-web 自己的每日上限。'},
  {code:'NN4', tag:'warn', text:'檔案上傳沒有大小限制，異常或誤觸的超大檔案會被整個讀進記憶體。加上 20MB 上限。'},
  {code:'NN3', tag:'neutral', text:'每個請求都重新建立一個 MongoClient，沒有連線池重用，效能浪費。改成處理程序生命週期內的單例（lru_cache）。'},
  {code:'NN5', tag:'neutral', text:'沒有獨立的 /api/health 健康檢查端點，監控工具只能打 / 混雜前端靜態檔案的可用性判斷。新增免驗證的 /api/health。'},
  {code:'NN7', tag:'neutral', text:'LLM 呼叫失敗完全沒有伺服器端 log，出問題難排查（主站的 llm/client.py 特意記錄方便除錯，kb-web 沒有比照）。補上狀態碼、截斷內容、空回應原因的記錄。'},
  {code:'NN8', tag:'neutral', text:'sentence-transformers 語意模型是第一次請求才 lazy load，服務重啟後第一位使用者要多等好幾秒。改成應用程式啟動時（lifespan）就預先載入。'},
  {code:'NN9', tag:'neutral', text:'前端登入後沒有登出功能，只能手動清 localStorage。導覽列加上登出按鈕。'},
 ]},

{date:'2026-07-27 04:11', range:'LL1–LL10', title:'Telegram 推播注入、LLM 節流破口、類股輪動除零當機修復',
 summary:'3 個平行稽核 agent 掃描後，最嚴重的幾項親自逐行讀 code 直接驗證（含實際 curl 打過確認）。這輪出貨過程本身也很值得記一筆：先後撞到 2 次自己新增的節流門檻設得太緊，把既有測試打壞——每次都是先直接懷疑「是不是我自己的改動」而非預設是外部資料源的雜訊，實測後才確認根因、對症下藥（分別是幫測試補上跟既有慣例一致的假來源 IP、以及把不合理的門檻放寬），而不是回退安全修復本身。',
 items:[
  {code:'LL1', tag:'critical', text:'send_telegram() 用 parse_mode="HTML"，POST /risk/notify（從公開、無驗證的投組風險頁就能觸發）把使用者傳入、完全沒跳脫的文字原樣塞進去——任何訪客都能在站主自己的 Telegram 裡插入粗體/可點擊連結，還能無限次觸發推播騷擾。改成純文字（沒有任何呼叫端真的需要 HTML 格式），並補上頻率限制。'},
  {code:'LL2', tag:'critical', text:'GET /risk/daily-brief、POST /daily-brief/send 都會呼叫 LLM，卻是全站唯一沒有掛 check_llm_rate_limit 的 LLM 端點——每日 LLM 額度是全站共用的單一計數器，沒有節流代表任何人都能無限次呼叫這支公開端點，把當天額度替所有人耗光。補上跟其他 LLM 端點一致的節流。'},
  {code:'LL3', tag:'warn', text:'POST /notifications/line/test 接受呼叫端任意帶入的 token 且無節流，等於一個公開的「LINE Notify token 有效性驗證機」，能拿來批次驗證大量竊取/猜測來的 token。補上頻率限制，同時保留設定頁「測試我自己的 token」這個合法用途。'},
  {code:'LL4', tag:'warn', text:'POST /backtest/run 先前完全沒有節流，且 engine.run() 是同步、CPU-bound 的 pandas/numpy 運算，一次請求還會連著過擬合檢查再跑兩次，直接卡住整個 event loop、拖累同一 worker 上所有使用者。丟進 asyncio.to_thread（同 II3 的作法），並補上節流。'},

const main = document.getElementById('main');
const search = document.getElementById('search');
const countEl = document.getElementById('count');

let totalItems = 0, totalSeries = DATA.length, totalCritical = 0;
DATA.forEach(s => s.items.forEach(it => { totalItems++; if (it.tag === 'critical') totalCritical++; }));
document.getElementById('stat-items').textContent = totalItems;
document.getElementById('stat-series').textContent = totalSeries;
document.getElementById('stat-critical').textContent = totalCritical;

function render() {
  main.innerHTML = '';
  DATA.forEach((s, si) => {
    const el = document.createElement('section');
    el.className = 'series';
    el.dataset.si = si;

    const head = document.createElement('div');
    head.className = 'series-head';
    head.innerHTML = `
      <div class="series-head-left">
        <span class="date mono">${s.date}</span>
        <span class="range mono">${s.range}</span>
        ${s.inProgress ? '<span class="inprogress">審查完成・出貨驗證中</span>' : ''}
      </div>
    `;
    el.appendChild(head);

    const h2 = document.createElement('h2');
    h2.className = 'serif';
    h2.textContent = s.title;
    el.appendChild(h2);

    if (s.summary) {
      const p = document.createElement('p');
      p.className = 'summary';
      p.textContent = s.summary;
      el.appendChild(p);
    }

    const ul = document.createElement('ul');
    ul.className = 'items';
    s.items.forEach(it => {
      const li = document.createElement('li');
      li.className = 'item';
      li.dataset.search = (it.code + ' ' + it.text).toLowerCase();
      li.innerHTML = `
        <span class="stripe ${it.tag}"></span>
        <span class="code mono">${it.code}</span>
        <span class="text">${it.text}</span>
      `;
      ul.appendChild(li);
    });
    el.appendChild(ul);
    main.appendChild(el);
  });
}
render();

function highlight(text, q) {
  if (!q) return text;
  const idx = text.toLowerCase().indexOf(q);
  if (idx === -1) return text;
  return text.slice(0, idx) + '<mark>' + text.slice(idx, idx + q.length) + '</mark>' + text.slice(idx + q.length);
}

search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  let visibleItems = 0;
  document.querySelectorAll('.series').forEach(sec => {
    let anyVisible = false;
    sec.querySelectorAll('li.item').forEach(li => {
      const match = !q || li.dataset.search.includes(q);
      li.classList.toggle('hidden', !match);
      if (match) { anyVisible = true; visibleItems++; }
    });
    const titleMatch = !q || sec.querySelector('h2').textContent.toLowerCase().includes(q);
    sec.classList.toggle('hidden', !anyVisible && !titleMatch);
    if (titleMatch && !anyVisible) {
      sec.querySelectorAll('li.item').forEach(li => li.classList.remove('hidden'));
    }
  });
  countEl.textContent = q ? `符合 ${visibleItems} 項` : '';
});
</script>
