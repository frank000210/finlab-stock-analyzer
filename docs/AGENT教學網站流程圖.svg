<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>AI Agent 教學網站 — 學習者旅程與系統流程</title>
  <desc>四泳道（學習者／前端網站／AI 助教 Agent／後端與資料）× 四階段（進站註冊／個人化分流／核心學習循環／專題結業）的跨職能流程圖。</desc>
  <defs>
    <marker id="a-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1E3A8A"/></marker>
    <marker id="a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0D9488"/></marker>
    <marker id="a-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#D97706"/></marker>
    <marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16A34A"/></marker>
    <marker id="a-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#F43F5E"/></marker>
    <marker id="a-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#94A3B8"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <style>
      text { font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", "Segoe UI", sans-serif; fill: #0F172A; }
      .t  { font-size: 14px; font-weight: 700; text-anchor: middle; }
      .s  { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .tw { font-size: 14px; font-weight: 700; text-anchor: middle; fill: #FFFFFF; }
      .sw { font-size: 11px; text-anchor: middle; fill: #DBEAFE; }
      .proc { fill: #FFFFFF; stroke: #1E3A8A; stroke-width: 1.6; filter: url(#sh); }
      .ai   { fill: #F0FDFA; stroke: #0D9488; stroke-width: 1.6; filter: url(#sh); }
      .dec  { fill: #FFFBEB; stroke: #D97706; stroke-width: 1.8; filter: url(#sh); }
      .db   { fill: #F1F5F9; stroke: #64748B; stroke-width: 1.4; }
      .dbt  { font-size: 13px; font-weight: 700; text-anchor: middle; fill: #334155; }
      .main { stroke: #1E3A8A; stroke-width: 2.4; fill: none; marker-end: url(#a-main); }
      .aif  { stroke: #0D9488; stroke-width: 2.4; fill: none; marker-end: url(#a-ai); }
      .decf { stroke: #D97706; stroke-width: 2.4; fill: none; marker-end: url(#a-dec); }
      .okf  { stroke: #16A34A; stroke-width: 2.4; fill: none; marker-end: url(#a-ok); }
      .loop { stroke: #F43F5E; stroke-width: 2.4; fill: none; stroke-dasharray: 8 5; }
      .halo { stroke: #FFFFFF; stroke-width: 9; fill: none; }
      .data { stroke: #94A3B8; stroke-width: 1.6; fill: none; stroke-dasharray: 4 4; marker-start: url(#a-data); marker-end: url(#a-data); }
      .lab  { font-size: 12px; font-weight: 700; fill: #B45309; }
      .chip { fill: #FFFFFF; stroke-width: 1.2; }
      .note { font-size: 11px; fill: #475569; }
      .lg   { font-size: 12px; fill: #334155; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <!-- ===== Header ===== -->
  <rect x="40" y="28" width="6" height="56" rx="3" fill="#1E3A8A"/>
  <text x="60" y="56" style="font-size:28px;font-weight:800;fill:#0F172A">AI Agent 教學網站 — 學習者旅程與系統流程</text>
  <text x="60" y="82" style="font-size:15px;fill:#64748B">從入門到實戰的個人化學習流程 · Cross-functional Swimlane Diagram</text>
  <rect x="1700" y="38" width="185" height="30" rx="15" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="1792" y="58" style="font-size:12px;font-weight:700;fill:#1E3A8A;text-anchor:middle">Learning Platform · v1.0</text>

  <!-- ===== Phase bar ===== -->
  <g>
    <path d="M160 98 H555 L565 111 L555 124 H160 Z" fill="#1E3A8A"/>
    <text x="360" y="116" style="font-size:13px;font-weight:700;fill:#fff;text-anchor:middle">PHASE 1 · 進站與註冊</text>
    <path d="M567 98 H895 L905 111 L895 124 H567 L577 111 Z" fill="#334E9E"/>
    <text x="738" y="116" style="font-size:13px;font-weight:700;fill:#fff;text-anchor:middle">PHASE 2 · 個人化分流</text>
    <path d="M907 98 H1690 L1700 111 L1690 124 H907 L917 111 Z" fill="#0D9488"/>
    <text x="1303" y="116" style="font-size:13px;font-weight:700;fill:#fff;text-anchor:middle">PHASE 3 · 核心學習循環（學 → 做 → 測 → 補強）</text>
    <path d="M1702 98 H1885 V124 H1702 L1712 111 Z" fill="#16A34A"/>
    <text x="1798" y="116" style="font-size:13px;font-weight:700;fill:#fff;text-anchor:middle">PHASE 4 · 專題結業</text>
  </g>

  <!-- ===== Swimlanes ===== -->
  <g>
    <rect x="40" y="130" width="1845" height="195" fill="#F8FAFC"/>
    <rect x="40" y="325" width="1845" height="195" fill="#FFFFFF"/>
    <rect x="40" y="520" width="1845" height="195" fill="#F8FAFC"/>
    <rect x="40" y="715" width="1845" height="195" fill="#FFFFFF"/>
    <rect x="40" y="130" width="1845" height="780" fill="none" stroke="#CBD5E1" stroke-width="1.2"/>
    <line x1="40" y1="325" x2="1885" y2="325" stroke="#E2E8F0" stroke-width="1.2"/>
    <line x1="40" y1="520" x2="1885" y2="520" stroke="#E2E8F0" stroke-width="1.2"/>
    <line x1="40" y1="715" x2="1885" y2="715" stroke="#E2E8F0" stroke-width="1.2"/>
    <!-- phase separators -->
    <line x1="566" y1="130" x2="566" y2="910" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2 6"/>
    <line x1="906" y1="130" x2="906" y2="910" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2 6"/>
    <line x1="1701" y1="130" x2="1701" y2="910" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2 6"/>
    <!-- lane headers -->
    <rect x="40" y="130" width="112" height="195" fill="#1E3A8A"/>
    <text x="96" y="222" style="font-size:17px;font-weight:800;fill:#fff;text-anchor:middle">學習者</text>
    <text x="96" y="242" style="font-size:11px;fill:#BFDBFE;text-anchor:middle">LEARNER</text>
    <rect x="40" y="325" width="112" height="195" fill="#3B5BA9"/>
    <text x="96" y="417" style="font-size:17px;font-weight:800;fill:#fff;text-anchor:middle">前端網站</text>
    <text x="96" y="437" style="font-size:11px;fill:#DBEAFE;text-anchor:middle">WEB UI</text>
    <rect x="40" y="520" width="112" height="195" fill="#0D9488"/>
    <text x="96" y="612" style="font-size:17px;font-weight:800;fill:#fff;text-anchor:middle">AI 助教</text>
    <text x="96" y="632" style="font-size:11px;fill:#CCFBF1;text-anchor:middle">TUTOR AGENT</text>
    <rect x="40" y="715" width="112" height="195" fill="#475569"/>
    <text x="96" y="807" style="font-size:17px;font-weight:800;fill:#fff;text-anchor:middle">後端與資料</text>
    <text x="96" y="827" style="font-size:11px;fill:#E2E8F0;text-anchor:middle">BACKEND · DATA</text>
  </g>

